<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Ruffle Launcher</title>

<script src="ruffle/ruffle.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game-frame {
    padding: 10px;
    background: #222;
    border: 3px solid #555;
    border-radius: 8px;
}
</style>

</head>

<body>

<div class="game-frame" id="frame"></div>

<script>

const params = new URLSearchParams(window.location.search);

const game = params.get("game");
const width = params.get("width") || 800;
const height = params.get("height") || 600;


const object = document.createElement("object");

object.data = "games/" + game;
object.type = "application/x-shockwave-flash";
object.width = width;
object.height = height;

object.setAttribute("allowfullscreen", "true");


document.getElementById("frame").appendChild(object);

</script>

</body>
</html>
