<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game</title>

<script src="ruffle/ruffle.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;

    /* Центрируем плеер на странице */
    display: flex;
    justify-content: center;
    align-items: center;
}

#player {
    width: 100%;
    max-width: 800px; /* Ограничиваем максимальную ширину */
    aspect-ratio: 4 / 3; /* Фиксируем пропорцию 800x600 */
    display: flex;
    justify-content: center;
    align-items: center;
}

ruffle-player {
    width: 100% !important;
    height: 100% !important;
}
</style>

</head>

<body>

<div id="player"></div>

<script>

const params = new URLSearchParams(window.location.search);
const game = params.get("game");

if (game) {

    window.addEventListener("load", () => {

        const ruffle = window.RufflePlayer.newest();

        const player = ruffle.createPlayer();

        document.getElementById("player").appendChild(player);

        /* Передаем конфиг для правильного масштабирования 800x600 */
        player.load({
            url: "games/" + decodeURIComponent(game),
            scale: "showAll",
            forceScale: true,
            letterbox: "off"
        });

    });

}

</script>

</body>
</html>
