<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Game</title>

<script src="ruffle/ruffle.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
}

/* Растягиваем контейнер и сам плеер Ruffle на 100% */
#player, ruffle-player, ruffle-embed, ruffle-object {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
}

/* Растягиваем canvas внутренности Ruffle */
ruffle-player canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>

</head>

<body>

<div id="player"></div>

<script>

const params = new URLSearchParams(window.location.search);
const game = params.get("game");

if (game) {

    window.addEventListener("load", () => {

        const ruffle = window.RufflePlayer.newest();

        const player = ruffle.createPlayer();

        document.getElementById("player").appendChild(player);

        player.load({
            url: "games/" + decodeURIComponent(game),
            
            /* exactFit — насильно растягивает SWF на всё окно (и по ширине, и по высоте) */
            scale: "exactFit",
            forceScale: true,
            
            /* Убираем рамки (letterbox) */
            letterbox: "off",
            
            /* Задаём черный фон плееру, чтобы не появлялось белых полос при загрузке */
            backgroundColor: "#000000",
            wmode: "opaque"
        });

    });

}

</script>

</body>
</html>
