<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Four identical balls</title>

<script src="ruffle/ruffle.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;

    display: flex;
    justify-content: center;
    align-items: center;
}

.game-container {
    width: 100vw;
    height: 75vw;
    max-width: 133.33vh;
    max-height: 100vh;
}

ruffle-player {
    width: 100% !important;
    height: 100% !important;
    display: block;
}
</style>

</head>

<body>

<div class="game-container">
    <ruffle-player></ruffle-player>
</div>

<script>

window.addEventListener("load", () => {

    const player = document.querySelector("ruffle-player");

    player.load({
        url: "games/Four_identical_balls.swf"
    });

});

</script>

</body>
</html>
