<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Game</title>

<script src="ruffle/ruffle.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
}

#player, ruffle-player, ruffle-embed, ruffle-object {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
}

ruffle-player canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>

</head>

<body>

<div id="player"></div>

<script>
const params = new URLSearchParams(window.location.search);
const game = params.get("game");

if (game) {
    window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player");

        container.appendChild(player);

        player.load({
            url: "games/" + decodeURIComponent(game),
            scale: "exactFit",
            forceScale: true,
            letterbox: "off",
            backgroundColor: "#000000",
            wmode: "opaque"
        });

        // Открываем Fullscreen при первом клике пользователя по контейнеру игры
        function enableFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
                    document.documentElement.msRequestFullscreen();
                }
            }
            // Удаляем слушатель, чтобы повторные клики в игре не выбивали fullscreen
            container.removeEventListener("click", enableFullscreen);
        }

        container.addEventListener("click", enableFullscreen);
    });
}
</script>

</body>
</html>
