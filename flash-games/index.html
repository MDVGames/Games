<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Game</title>

<script src="ruffle/ruffle.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
    
    /* Добавлено центрирование контейнера 800x600 по центру экрана */
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 1. ЗАДАЕМ ФИКСИРОВАННЫЙ РАЗМЕР 800x600 */
#player {
    width: 800px !important;
    height: 600px !important;
    position: relative;
}

/* Сам Ruffle внутри контейнера занимает 100% от этих 800x600 */
ruffle-player, ruffle-embed, ruffle-object {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
}

ruffle-player canvas {
    width: 100% !important;
    height: 100% !important;
}

/* 2. СТИЛИ ДЛЯ ВСПЛЫВАЮЩЕЙ ПЛАШКИ-СЧЕТЧИКА (ОТЛАДЧИК) */
#size-debugger {
    position: fixed;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.85);
    color: #00ff00;
    font-family: monospace;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid #00ff00;
    z-index: 9999;
    pointer-events: none; /* Не мешает кликать по игре */
}
</style>

</head>

<body>

<!-- Индикатор размера в правом верхнем углу -->
<div id="size-debugger">800px × 600px</div>

<div id="player"></div>

<script>
const params = new URLSearchParams(window.location.search);
const game = params.get("game");

if (game) {
    window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player");

        container.appendChild(player);

        function goFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            }
        }

        player.addEventListener("click", () => {
            goFullscreen();
        }, { once: true });

        player.addEventListener("play", () => {
            goFullscreen();
        }, { once: true });

        player.load({
            url: "games/" + decodeURIComponent(game),
            scale: "exactFit",
            forceScale: true,
            letterbox: "off",
            backgroundColor: "#000000",
            wmode: "opaque",
            autoplay: "on" 
        });
    });
}

// 3. СКРИПТ ОБНОВЛЕНИЯ ЦИФР В ПЛАШКЕ-ОТЛАДЧИКЕ
const playerDiv = document.getElementById("player");
const sizeDebugger = document.getElementById("size-debugger");

const resizeObserver = new ResizeObserver(entries => {
    for (let entry of entries) {
        const width = Math.round(entry.contentRect.width);
        const height = Math.round(entry.contentRect.height);
        sizeDebugger.textContent = `${width}px × ${height}px`;
    }
});

resizeObserver.observe(playerDiv);
</script>

</body>
</html>
