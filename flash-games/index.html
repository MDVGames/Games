<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Four identical balls</title>

<script src="ruffle/ruffle.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#player, ruffle-player {
    width: 100%;
    height: 100%;
    display: block;
}
</style>

</head>

<body>

<div id="player"></div>

<script>
window.addEventListener("load", () => {

    const ruffle = window.RufflePlayer.newest();

    const player = ruffle.createPlayer();

    document.getElementById("player").appendChild(player);

    player.load({
        url: "games/Four_identical_balls.swf",
        scale: "showAll",
        forceScale: true,
        letterbox: "off"
    });

});
</script>

</body>
</html>
