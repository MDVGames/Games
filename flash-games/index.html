<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>Game</title>

<script src="ruffle/ruffle.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
}

#player, ruffle-player, ruffle-embed, ruffle-object {
    width: 100% !important;
    height: 100% !important;
    display: block !important;
}

ruffle-player canvas {
    width: 100% !important;
    height: 100% !important;
}
</style>

</head>

<body>

<div id="player"></div>

<script>
const params = new URLSearchParams(window.location.search);
const game = params.get("game");

if (game) {
    window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player");

        container.appendChild(player);

        // Функция включения полноэкранного режима
        function goFullscreen() {
            if (!document.fullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            }
        }

        // 1. Отслеживаем клик по самому Ruffle (включая родную кнопку Play)
        player.addEventListener("click", () => {
            goFullscreen();
        }, { once: true }); // once: true сработает ровно 1 раз при первом клике

        // 2. Если в Ruffle включена политика "Play button" (autoplay="unmuted"),
        // подхватываем событие запуска
        player.addEventListener("play", () => {
            goFullscreen();
        }, { once: true });

        // Загрузка игры
        player.load({
            url: "games/" + decodeURIComponent(game),
            scale: "exactFit",
            forceScale: true,
            letterbox: "off",
            backgroundColor: "#000000",
            wmode: "opaque",
            
            // Заставляем Ruffle показывать свою родную оверлей-кнопку Play, если нужно
            autoplay: "on" 
        });
    });
}
</script>

</body>
</html>
