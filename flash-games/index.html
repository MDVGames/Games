<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<style>

  html, body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background-color: #000;

    display: flex;

    justify-content: center;

    align-items: center;

  }



  /* Автоматически высчитывает высоту 3/4 от ширины (4:3) */

  .game-container {

    width: 100%;

    max-width: 100%;

    aspect-ratio: 4 / 3;

    position: relative;

  }



  iframe {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    border: 0;

  }

</style>

</head>

<body>



<div class="game-container">

  <iframe 

      src="https://mdvgames.github.io/Games/flash-games/?game=Four_identical_balls.swf" 

      scrolling="no"

      allowfullscreen>

  </iframe>

</div>



</body>

</html>
